version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: ctrlfarm-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ctrlfarm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8

    container_name: ctrlfarm-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    container_name: ctrlfarm-mediamtx
    restart: unless-stopped
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_API_PASSWORD:?Add MEDIAMTX_API_PASSWORD to .env}
    ports:
      - "127.0.0.1:9997:9997/tcp"
      - "127.0.0.1:8889:8889/tcp"
      - "127.0.0.1:8189:8189/udp"
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro

volumes:
  postgres_data:
  redis_data:
